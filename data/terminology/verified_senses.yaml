            supports: The abbreviation table explicitly maps PA to Pulmonary artery.
      - gold_sense: Physician assistant
        verification_status: terminology_verified
        references:
          - title: NCI SEER Training — Common Abbreviations
            url: https://training.seer.cancer.gov/abstracting/additional/abbreviations/all.html
            supports: The abbreviation table explicitly maps PA to Physician assistant.
  AP:
